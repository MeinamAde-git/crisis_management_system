version: '3.8'

services:
  # FastAPI Application Core
  aegis-core:
    build: .
    container_name: aegis_crisis_core
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PROJECT_NAME=AEGIS Crisis Intelligence
      - DATABASE_URL=postgresql://postgres:password123@postgis:5432/crisis_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgis
      - redis

  # Geospatial PostgreSQL Database
  postgis:
    image: postgis/postgis:16-3.4
    container_name: crisis_postgis
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: crisis_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  # In-Memory Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: crisis_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgis_data:
  redis_data: